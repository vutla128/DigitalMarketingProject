{% extends 'base.html' %}

{% block title %}{{ 'Edit' if campaign else 'Add' }} Campaign - MarketMate{% endblock %}
{% block page_header %}{{ 'Edit' if campaign else 'Add New' }} Campaign{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="form-card">
            <h4 class="fw-bold mb-4 text-dark"><i class="fa-solid fa-bullhorn text-primary me-2"></i>Campaign Information</h4>
            
            <form action="{{ url_for('edit_campaign', id=campaign.id) if campaign else url_for('add_campaign') }}" method="POST">
                <div class="row g-3">
                    <!-- Campaign Name -->
                    <div class="col-md-6">
                        <label for="name" class="form-label">Campaign Name *</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ campaign.name if campaign else '' }}" placeholder="Summer Special Promotion" required>
                    </div>

                    <!-- Platform Selection -->
                    <div class="col-md-6">
                        <label for="platform" class="form-label">Platform *</label>
                        <select class="form-select" id="platform" name="platform" required>
                            <option value="" disabled {{ 'selected' if not campaign }}>Choose platform...</option>
                            {% for plat in ['Instagram', 'Facebook', 'Google Ads', 'YouTube', 'LinkedIn'] %}
                                <option value="{{ plat }}" {{ 'selected' if campaign and campaign.platform == plat }}>{{ plat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Date range -->
                    <div class="col-md-6">
                        <label for="start_date" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="start_date" name="start_date" value="{{ campaign.start_date if campaign else '' }}">
                    </div>
                    <div class="col-md-6">
                        <label for="end_date" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="end_date" name="end_date" value="{{ campaign.end_date if campaign else '' }}">
                    </div>

                    <!-- Campaign Status -->
                    <div class="col-md-4">
                        <label for="status" class="form-label">Status *</label>
                        <select class="form-select" id="status" name="status" required>
                            {% for stat in ['Planned', 'Active', 'Completed'] %}
                                <option value="{{ stat }}" {{ 'selected' if campaign and campaign.status == stat or (not campaign and stat == 'Planned') }}>{{ stat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Budget -->
                    <div class="col-md-4">
                        <label for="budget" class="form-label">Budget ($) *</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="budget" name="budget" value="{{ campaign.budget if campaign else '0.00' }}" required>
                    </div>

                    <!-- Revenue (for ROI calculation) -->
                    <div class="col-md-4">
                        <label for="revenue" class="form-label">Generated Revenue ($)</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="revenue" name="revenue" value="{{ campaign.revenue if campaign else '0.00' }}">
                    </div>

                    <!-- Performance Metrics Section -->
                    <div class="border-top my-4 pt-3 w-100">
                        <h5 class="fw-semibold text-muted mb-3">Performance Data (Optional)</h5>
                    </div>

                    <!-- Impressions -->
                    <div class="col-md-3">
                        <label for="impressions" class="form-label">Impressions</label>
                        <input type="number" min="0" class="form-control" id="impressions" name="impressions" value="{{ campaign.impressions if campaign else '0' }}">
                    </div>

                    <!-- Clicks -->
                    <div class="col-md-3">
                        <label for="clicks" class="form-label">Clicks</label>
                        <input type="number" min="0" class="form-control" id="clicks" name="clicks" value="{{ campaign.clicks if campaign else '0' }}">
                    </div>

                    <!-- Leads Generated -->
                    <div class="col-md-3">
                        <label for="leads" class="form-label">Leads Generated</label>
                        <input type="number" min="0" class="form-control" id="leads" name="leads" value="{{ campaign.leads if campaign else '0' }}">
                    </div>

                    <!-- Conversions -->
                    <div class="col-md-3">
                        <label for="conversions" class="form-label">Conversions</label>
                        <input type="number" min="0" class="form-control" id="conversions" name="conversions" value="{{ campaign.conversions if campaign else '0' }}">
                    </div>

                    <!-- Form Controls -->
                    <div class="col-12 mt-4 pt-2 border-top d-flex gap-3 justify-content-end">
                        <a href="{{ url_for('campaigns') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">{{ 'Update' if campaign else 'Save' }} Campaign</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
